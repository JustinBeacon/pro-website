<script type="application/ld+json">{"@context": "https://schema.org", "@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "What are PRO services in the UAE?", "acceptedAnswer": {"@type": "Answer", "text": "PRO (Public Relations Officer) services cover government-facing administration such as visa, permit, labour and Emirates ID processes, handled on a company's behalf."}}, {"@type": "Question", "name": "What is included in BEACON's PRO plans?", "acceptedAnswer": {"@type": "Answer", "text": "Packages cover PRO and government-related employee administration. The exact inclusions are confirmed with you when your scope is agreed."}}, {"@type": "Question", "name": "Can Free Zone and Mainland companies use PRO services?", "acceptedAnswer": {"@type": "Answer", "text": "Where the relevant services apply, yes. Tell us your licence type and we'll confirm what applies to your company."}}, {"@type": "Question", "name": "What is the difference between outsourced PRO support and an in-house PRO employee?", "acceptedAnswer": {"@type": "Answer", "text": "An in-house PRO is your own hire and responsibility. Outsourced support lets BEACON coordinate agreed processes, so you don't have to maintain that function yourself."}}, {"@type": "Question", "name": "Are government fees and third-party charges included in the monthly price?", "acceptedAnswer": {"@type": "Answer", "text": "These are confirmed when you subscribe. We don't assume they're included."}}, {"@type": "Question", "name": "How is the employee count determined for each package?", "acceptedAnswer": {"@type": "Answer", "text": "Packages are based on your company's employee count: 1–5 (Spark), 6–10 (Signal), 11–15 (Flare) or 16+ employees (Lighthouse). We confirm the count with you when you subscribe."}}, {"@type": "Question", "name": "What happens if our company grows beyond our selected package?", "acceptedAnswer": {"@type": "Answer", "text": "Talk to us and we'll move you to the plan that fits your new team size. Companies reaching 16 or more employees meet with us to agree their plan."}}, {"@type": "Question", "name": "Can BEACON assist with employee renewals and cancellations?", "acceptedAnswer": {"@type": "Answer", "text": "Renewals and cancellation-related government processes can be supported, subject to the agreed service scope."}}, {"@type": "Question", "name": "Is this an annual subscription?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. Every plan is an annual subscription, and your monthly price is locked in for the full 12 months."}}, {"@type": "Question", "name": "Can my monthly price change during the year?", "acceptedAnswer": {"@type": "Answer", "text": "No. Your monthly price is locked in for 12 months from the start of your subscription."}}, {"@type": "Question", "name": "Does PRO Services include payroll or leave tracking?", "acceptedAnswer": {"@type": "Answer", "text": "No. BEACON PRO Services focuses on PRO and government-related employee administration. Payroll processing, leave tracking, and ongoing HR administration are separate services available through BEACON's accounting services."}}, {"@type": "Question", "name": "Can we use BEACON for both PRO and accounting services?", "acceptedAnswer": {"@type": "Answer", "text": "Yes. They're separate services, and you can enquire about both."}}, {"@type": "Question", "name": "How do I subscribe?", "acceptedAnswer": {"@type": "Answer", "text": "Choose your plan, then message us on WhatsApp at +971 54 777 5023 or email info@beaconuae.com or management@beaconuae.com."}}]}</script>

<body>
<script>document.documentElement.classList.add("js","ldg")</script>
<div id="loader" role="status" aria-label="Loading BEACON">
  <div class="ld-mid">
    <img class="ld-logo" src="./assets/logo.png" alt="BEACON Al Manal LLC" width="480" height="383">
  </div>
  <span class="ld-num">0</span>
  <span class="ld-bar"></span>
</div>
<script>
/* loader: waits for the hero photo and fonts (max ~3s), short on repeat visits */
(function(){
  var L=document.getElementById("loader"),H=document.documentElement,num=L.querySelector(".ld-num"),bar=L.querySelector(".ld-bar");
  var seen=false;try{seen=sessionStorage.getItem("bcn4")==="1"}catch(e){}
  var minT=seen?300:1200,maxT=3000,t0=performance.now(),ready=false,shown=0,last=t0,done=false;
  var img=new Image();img.src="./assets/kyhero.webp";
  Promise.all([img.decode?img.decode().catch(function(){}):0,document.fonts?document.fonts.ready:0]).then(function(){ready=true});
  function f(now){var dt=Math.min(.25,(now-last)/1000);last=now;var el=now-t0,tp=Math.min(1,el/minT);
    var target=ready?(tp>=1?100:tp*100):Math.min(90,tp*90);if(el>maxT)target=100;
    shown+=(target-shown)*(1-Math.exp(-dt*9));if(target-shown<.5)shown=target;
    num.textContent=Math.round(shown);bar.style.transform="scaleX("+shown/100+")";
    if(shown>=100&&!done){done=true;setTimeout(out,180);return}requestAnimationFrame(f)}
  function out(){try{sessionStorage.setItem("bcn4","1")}catch(e){}L.classList.add("out");H.classList.remove("ldg");
    setTimeout(function(){dispatchEvent(new Event("beacon:ready"))},120);setTimeout(function(){L.remove()},1100)}
  requestAnimationFrame(f);
})();
if("scrollRestoration" in history)history.scrollRestoration="manual";
</script>
<div id="root"></div>
